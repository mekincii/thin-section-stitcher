[project]
name = "thin-section-stitcher"
version = "0.1.0"
description = "Coordinate-free stitching of overlapping petrographic thin-section microscope images."
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "opencv-python",
    "pandas",
    "networkx",
    "matplotlib",
    "scipy",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]